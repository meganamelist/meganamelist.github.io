<!DOCTYPE html>
<html lang="th" style="--ui-scale: 1; --card-scale: 1;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#030406">
  <title>ALL - FAMILY</title>
  <meta name="description" content="FAMILY">

  <!-- Favicon placeholder -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="./theme.css">
  <script src="./protect.js"></script>
</head>
<body>

  <!-- WebGL Dynamic Ferrofluid & Liquid Chrome Canvas -->
  <canvas id="bg" aria-hidden="true"></canvas>

  <!-- Film Grain Overlay -->
  <div class="grain" aria-hidden="true"></div>

  <!-- ==========================================================================
       VIEW 1: HERO LANDING
       ========================================================================== -->
  <main class="view view-landing is-active" id="view-landing">
    <header class="hud">
      <span class="hud-brand">FAMILY <b>—</b> PARTNER</span>
    </header>

    <section class="hero">
      <p class="hero-eyebrow">
        <span></span>297<span></span>
      </p>

      <h1 class="hero-title">
        <span class="hero-line hero-line-1" data-text="Sahaphan">PARTNER</span>
        <span class="hero-line hero-line-2" data-text="Allfriend">ALL - FAMILY</span>
      </h1>

      <div class="enter-wrap">
        <a href="Partner.html" class="enter-btn" id="enterBtn">
          <span class="enter-glow" aria-hidden="true"></span>
          <span class="enter-shine" aria-hidden="true"></span>
          <span>เข้าสู่เครือ</span>
          <svg class="enter-arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </a>
      </div>
    </section>
  </main>

  <!-- ==========================================================================
       VIEW 2: CREWS / FACTIONS SHOWCASE
       ========================================================================== -->
  <main class="view view-home view-crews" id="view-crews">
    <header class="home-top">
      <div class="ht-left">
        <button class="back-btn" id="crewsBackBtn" type="button" aria-label="กลับหน้าแรก" data-glass="">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path d="M19 12H5M11 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
        <span class="home-brand">SAHAPHAN <i>Allfriend</i></span>
      </div>
      <button class="menu-btn" id="menuBtn" type="button" aria-label="เปิดเมนู" data-glass="">
        <span></span><span></span><span></span>
      </button>
    </header>

    <section class="home-body crews-body">
      <div class="home-head">
        <span class="home-kicker">The Federation</span>
        <h2 class="home-title">เครือในสหพันธ์</h2>
      </div>

      <!-- Injected by theme.js -->
      <div class="crew-row" id="crews-grid"></div>
    </section>

    <nav class="crew-pager" id="crewPager" aria-label="เปลี่ยนหน้าการ์ดเครือ">
      <button class="pg-arrow" id="pgPrev" type="button" aria-label="หน้าก่อนหน้า" disabled>‹</button>
      <b class="pg-label" id="pgLabel">1/2</b>
      <button class="pg-arrow" id="pgNext" type="button" aria-label="หน้าถัดไป">›</button>
    </nav>
  </main>

  <!-- ==========================================================================
       VIEW 3: MEMBERS DIRECTORY
       ========================================================================== -->
  <main class="view view-home" id="view-members">
    <header class="home-top">
      <button class="back-btn" id="membersBackBtn" type="button" aria-label="กลับไปหน้าเครือ" data-glass="">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path d="M19 12H5M11 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
      <span class="home-brand">SAHAPHAN <b>Allfriend</b></span>
    </header>

    <section class="home-body">
      <div class="home-head">
        <span class="home-kicker" id="membersKicker">The Members</span>
        <h2 class="home-title" id="membersTitle">สมาชิกเครือ</h2>
      </div>

      <!-- Controls: Search & Role Filters -->
      <div class="controls">
        <label class="search" data-glass="">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input type="text" id="memberSearch" placeholder="ค้นหาสมาชิก, ดิสคอร์ด, หรือเกม..." autocomplete="off" spellcheck="false">
        </label>

        <div class="filters" id="filters" role="tablist">
          <button class="filter-btn is-active" type="button" data-filter="ALL" data-glass="">
            <span>ทั้งหมด</span>
            <b id="count-all">0</b>
          </button>
          <button class="filter-btn" type="button" data-filter="FOUNDER" data-glass="">
            <i style="background: #ffffff;"></i>
            <span>Founder</span>
            <b id="count-founder">0</b>
          </button>
          <button class="filter-btn" type="button" data-filter="HEAD" data-glass="">
            <i style="background: #f87171;"></i>
            <span>Head</span>
            <b id="count-head">0</b>
          </button>
          <button class="filter-btn" type="button" data-filter="MEMBER" data-glass="">
            <i style="background: #a3acb9;"></i>
            <span>Member</span>
            <b id="count-member">0</b>
          </button>
        </div>
      </div>

      <!-- Member Role Bands Container -->
      <div class="role-bands" id="members-bands"></div>
    </section>
  </main>


  <!-- ==========================================================================
       MEMBER DETAIL MODAL
       ========================================================================== -->
  <div class="modal-backdrop" id="memberModal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button class="modal-close" id="modalClose" type="button" aria-label="ปิดหน้าต่าง">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="modal-header">
        <div class="modal-avatar">
          <span id="modalAvatarChar">?</span>
        </div>
        <div class="modal-heading">
          <div class="mc-role" id="modalRole">
            <i></i><span>MEMBER</span>
          </div>
          <h2 class="modal-name" id="modalName">ชื่อสมาชิก</h2>
          <p class="modal-sub" id="modalSub">ตำแหน่งย่อย</p>
        </div>
      </div>

      <div class="modal-section">
        <span class="modal-label">เกี่ยวกับ</span>
        <p class="modal-text" id="modalBio">-</p>
      </div>

      <div class="modal-info-grid">
        <div class="modal-info-item">
          <span class="modal-label">DISCORD</span>
          <div class="modal-info-val" id="modalDiscord">-</div>
        </div>
        <div class="modal-info-item">
          <span class="modal-label">INSTAGRAM</span>
          <div class="modal-info-val" id="modalInstagram">-</div>
        </div>
      </div>

      <div class="modal-section">
        <span class="modal-label">เกมและกิจกรรม</span>
        <p class="modal-text" id="modalGame">-</p>
      </div>

      <div class="modal-actions">
        <button class="mc-link" id="modalCopyBtn" type="button" style="flex: 1; justify-content: center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"></path>
          </svg>
          <span>คัดลอก Discord</span>
        </button>
        <a class="mc-link" id="modalIgBtn" href="#" target="_blank" rel="noopener noreferrer" style="flex: 1; justify-content: center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
          <span>เปิด Instagram</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Toast Notification Popup -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Script Controller -->
  <script src="./theme.js"></script>
</body>
</html>
